name: Build Duolingo Chess Copilot APK

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # NNUE 网络已迁入 Git LFS，必须显式拉取真实文件，否则 APK 会打进指针文件
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Ground Truth & Parity Verification Gates
        run: |
          pip install opencv-python-headless numpy
          python tools/validate_grid_calibration.py
          python tools/verify_ground_truth_diff.py
          python tools/verify_kotlin_parity.py

      - name: Bug Frame Cell-Level Forensics (诊断输出, 供误分类/漏子证据采集)
        run: python tools/inspect_bug_frames.py

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        working-directory: android_copilot
        run: |
          if [ ! -f "gradlew" ]; then
            gradle wrapper
          fi
          chmod +x gradlew

      - name: Verify LFS Assets Materialized (响亮失败门禁)
        run: |
          NNUE=android_copilot/app/src/main/assets/nnue/nn-5af11540bbfe.nnue
          SIZE=$(stat -c%s "$NNUE")
          echo "NNUE size: $SIZE bytes"
          if [ "$SIZE" -lt 10000000 ]; then
            echo "::error::NNUE 文件疑似 LFS 指针未实体化 (${SIZE} bytes)，APK 将携带无效网络！"
            head -c 200 "$NNUE"
            exit 1
          fi

      - name: Run Unit Tests & Build Debug APK
        working-directory: android_copilot
        run: |
          ./gradlew test --stacktrace
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Duolingo-Chess-Copilot-APK
          path: android_copilot/app/build/outputs/apk/debug/*.apk
          retention-days: 14
